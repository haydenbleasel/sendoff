name: Validate
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  # Maintainer commits go straight to main, so run there too.
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Each is a root script: lint and format, typecheck, tests (the
        # Worker's run inside workerd), and the docs site and create-sendoff.
        task: [check, types, test, build]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The version in package.json's packageManager field.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: bun run ${{ matrix.task }}
