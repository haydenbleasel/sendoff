version: 2
updates:
  # Keep the pinned GitHub Actions up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"
    labels: ["dependencies", "github_actions"]

  # Security updates only for npm dependencies (bun.lock). Version bumps are
  # managed by hand, so the PR limit is 0 to turn off non-security updates.
  - package-ecosystem: "bun"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
